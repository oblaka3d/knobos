name: build
on: [push, pull_request]
jobs:
  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board: [c3, s3]
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32${{ matrix.board }}
          command: idf.py -B build.${{ matrix.board }} -DSDKCONFIG=build.${{ matrix.board }}/sdkconfig -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.${{ matrix.board }}" build
      - run: cp build.${{ matrix.board }}/knobos.bin knobos-${{ matrix.board }}.bin
      - uses: actions/upload-artifact@v4
        with:
          name: knobos-${{ matrix.board }}
          path: knobos-${{ matrix.board }}.bin
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S test/host -B build-host && cmake --build build-host && ctest --test-dir build-host --output-on-failure
